<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Figtree:ital,wght@0,300..900;1,300..900&family=Fraunces:ital,opsz,wght@0,9..144,100..900;1,9..144,100..900&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Kumbh+Sans:wght,YOPQ@100..900,300&family=League+Spartan:wght@100..900&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Outfit:wght@100..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Raleway:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
  
  <title>Frontend Mentor | Intro component with sign up form</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
  <!-- <style>
    .attribution { font-size: 0.6875rem; text-align: center; }
    .attribution a { color: hsl(228, 45%, 44%); }
  </style> -->
</head>
<body class="min-h-screen bg-[hsl(0,100%,74%)] p-6  flex justify-center items-center font-['Poppins',_sans-serif] bg-[url('images/bg-intro-mobile.png')] bg-no-repeat bg-cover bg-center bg-fixed sm:8  sm:bg-[url(images/bg-intro-desktop.png)]">

 <main class="w-full h-full  max-w-sm flex flex-col justify-center items-center p-4 sm:max-w-2xl sm:flex sm:flex-row sm:justify-center sm:items-center sm:gap-10 lg:max-w-5xl lg:gap-20">
  
    <div class="mb-8">
      <h2 class="text-2xl font-bold text-center text-white sm:text-start sm:text-2xl lg:text-4xl "> Learn to code by watching others</h2>
      
      <p class="text-center text-gray-200 font-normal mt-4 leading-6 tracking-tighter sm:text-start sm:tracking-normal sm:text-sm sm:leading-7 lg:leading-5">See how experienced developers solve problems in real-time. Watching scripted tutorials is great, but understanding how developers think is invaluable.</p>
    </div>


  <div class="w-full">
    <button id="freeTrial" type="submit" class="bg-purple-700 w-full py-2 rounded-md text-purple-300 font-semibold hover:cursor-pointer hover:bg-purple-900 hover:text-purple-200">Try it free 7 days then $20/mo. thereafter</button>

  <form id="code" class="p-4 bg-purple-50 mt-4 rounded-md lg:p-6">
    <input class="w-full border border-gray-300 px-3 py-3 rounded-sm mb-3 focus:border-blue-900 focus:outline-none placeholder:font-semibold " type="text" id="firstName" placeholder="FirstName">

    <p class="m-2" id="iName"></p>

    <input class="w-full border focus:border-blue-900 focus:outline-none border-gray-300 px-3 py-3 rounded-sm mb-3 placeholder:font-semibold " type="text" id="lastName" placeholder="Last Name">

    <p class="m-2" id="iSurname"></p>

    <input class="w-full border-gray-300 border focus:border-blue-900 focus:outline-none  px-3 py-3 rounded-sm mb-3 placeholder:font-semibold " type="email" id="email" placeholder="Email Address">

    <p class="m-2" id="iEmail"></p>

    <input class="w-full border-gray-300 border px-3 py-3 rounded-sm mb-3 focus:border-blue-900 focus:outline-none  placeholder:font-semibold " type="password" id="password" placeholder="Password">

    <p class="m-2" id="iPassword"></p>

    <button type="submit" id="terms" class="bg-green-400 w-full p-3 rounded-md font-semibold text-gray-200 uppercase mb-3 hover:cursor-pointer hover:bg-green-700">Claim your free trial </button>

    <p class="text-[10px] text-center trracking-wider opacity-30 font-semibold">By clicking the button, you are agreeing to our <span class="text-red-500 font-bold text-{11px}">Terms and Services</span></p>
  </form>
 
  </div>

 </main>

</body>
</html>
